# RosterResource dashboard: the one workflow that runs everything.
#
#   Install      unpacks the whole project (embedded at the bottom of this file) into the repo
#   Refresh      every 6 hours; at most ONE pull per 48 hours, enforced in the code (rr/gate.py)
#   Website      publishes the dashboard to GitHub Pages after new data or code changes
#   Tests        on every code change
#
# Run it by hand: Actions tab > "RosterResource" > Run workflow > choose a task.
# Only "refresh" ever contacts FanGraphs, and only when the 48-hour gate allows it.
name: RosterResource

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: "What to do"
        type: choice
        default: refresh
        options:
          - refresh
          - install
          - website
          - tests
          - clear-halt
          - republish
          - record-prior-pull
      prior_pull:
        description: "Only for record-prior-pull: time of a pull made elsewhere, e.g. 2026-09-24T08:49:03+00:00"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ check ---
  check:
    runs-on: ubuntu-latest
    outputs:
      installed: ${{ steps.c.outputs.installed }}
      task: ${{ steps.c.outputs.task }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          TASK: ${{ inputs.task }}
        run: |
          if [ -f requirements.txt ] && [ -f rr/gate.py ]; then echo "installed=true" >> "$GITHUB_OUTPUT"; else echo "installed=false" >> "$GITHUB_OUTPUT"; fi
          case "$EVENT" in
            schedule) task=refresh ;;
            push) task=push ;;
            *) task="${TASK:-refresh}" ;;
          esac
          echo "task=$task" >> "$GITHUB_OUTPUT"
          if [ ! -f requirements.txt ] && [ "$task" != "install" ]; then
            echo "::notice::The project isn't installed yet. Run this workflow with the task 'install'."
          fi

  # ---------------------------------------------------------------- install ---
  install:
    needs: check
    if: needs.check.outputs.task == 'install'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
