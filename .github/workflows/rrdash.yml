      - name: Commit the project files
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Already up to date."; exit 0; fi
          git commit -q -m "Install RosterResource dashboard files"
          git push -q origin "HEAD:$BRANCH"
          echo "Committed the project files to $BRANCH."

  # ------------------------------------------------------------------ tests ---
  tests:
    needs: [check, install]
    if: >-
      always() && needs.install.result != 'failure' &&
      (needs.check.outputs.installed == 'true' || needs.install.result == 'success') &&
      contains(fromJSON('["push","tests","install"]'), needs.check.outputs.task)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  # ---------------------------------------------------------------- refresh ---
  refresh:
    needs: [check, install]
    if: >-
      always() && needs.install.result != 'failure' &&
      needs.check.outputs.installed == 'true' &&
      contains(fromJSON('["refresh","clear-halt","republish","record-prior-pull"]'), needs.check.outputs.task)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: rr-refresh
      cancel-in-progress: false
    permissions:
      contents: write   # push the data branch
      issues: write     # open an issue if FanGraphs starts refusing requests
    outputs:
      saved: ${{ steps.saved.outputs.saved }}
    env:
      TASK: ${{ needs.check.outputs.task }}
      RR_DATA_DIR: ${{ github.workspace }}/data
      RR_PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load the data branch (pull log, HALT flag, snapshots)
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git clone -q --depth 1 --branch data "$RR_PUSH_URL" data
            rm -rf data/.git
          else
            echo "No data branch yet; this will be the first pull."
            mkdir -p data
          fi

      - name: Maintenance (no request to FanGraphs)
        id: maint
        if: env.TASK != 'refresh'
        env:
          PRIOR: ${{ inputs.prior_pull }}
        run: |
          set -e
          case "$TASK" in
            clear-halt)
              python -c "from rr import config; from rr.gate import Gate; print('Cleared HALT.' if Gate(config.STATE_DIR).clear_halt() else 'Was not halted.')" ;;
            record-prior-pull)
              if [ -z "$PRIOR" ]; then echo "::error::Fill in the time box for record-prior-pull."; exit 1; fi
              python -m rr record-prior-pull "$PRIOR" ;;
            republish)
              pip install -q -r requirements.txt
              python -m rr publish
              python -m rr prune ;;
          esac
          bash scripts/push-data.sh "Maintenance: $TASK ($(date -u +%Y-%m-%dT%H:%MZ))"

      - name: Gate check (standard library only, no request to FanGraphs)
        id: gate
        if: env.TASK == 'refresh'
        run: |
          set +e
          python -m rr.gatecheck
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "4" ]; then
            echo "::warning::Refreshes are halted. See the open issue, then run this workflow with the task 'clear-halt'."
          fi
          exit 0

      - name: Install dependencies
        if: steps.gate.outputs.code == '0'
        run: pip install -r requirements.txt

      - name: Refresh (current season only)
        id: refresh
        if: steps.gate.outputs.code == '0'
        run: |
          set +e
          python -m rr refresh --before-fetch "bash scripts/push-data.sh 'Pull started (attempt logged before any request)'"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish (pre-parse for the dashboard)
        id: publish
        if: contains(fromJSON('["0","1","2"]'), steps.refresh.outputs.code)
        continue-on-error: true
        run: |
          python -m rr publish
          python -m rr prune

      - name: Save to the data branch
        id: save
        if: always() && steps.gate.outputs.code == '0' && steps.refresh.outputs.code != '5'
        run: bash scripts/push-data.sh "Refresh finished with exit code ${{ steps.refresh.outputs.code }}"

      - name: Note whether new data was saved
        id: saved
        if: always()
        run: |
          if [ "${{ steps.maint.outcome }}" = "success" ] || [ "${{ steps.save.outcome }}" = "success" ]; then
            echo "saved=true" >> "$GITHUB_OUTPUT"
          else
            echo "saved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue if FanGraphs refused requests
        if: steps.refresh.outputs.code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reason="$(cat data/state/HALT 2>/dev/null || echo 'see workflow log')"
          gh issue create --title "RosterResource refresh halted: requests refused" --body "$(cat <<BODY
          The scheduled refresh stopped because FanGraphs/Cloudflare appears to be refusing requests from this workflow.

          \`\`\`
          $reason
          \`\`\`

          Nothing will be retried and no further pulls will run until the HALT flag is cleared
          (Actions > RosterResource > Run workflow > task: clear-halt).
          Per the project rules there is no workaround in the code (no browser user-agent, no challenge solving, no proxies).

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BODY
          )"

      - name: Report result
        if: always() && steps.gate.outputs.code == '0'
        run: |
          if [ "${{ steps.publish.outcome }}" = "failure" ]; then
            echo "::error::The pull was saved, but publishing for the dashboard failed. See the Publish step."
            exit 1
          fi
          case "${{ steps.refresh.outputs.code }}" in
            0) echo "Refresh complete." ;;
            1) echo "::warning::Refresh finished with some pages missing. See the log above." ;;
            2) echo "::error::FanGraphs refused requests. Refreshes are halted; an issue was opened."; exit 1 ;;
            3) echo "Gate closed at refresh time; nothing fetched." ;;
            5) echo "::error::Could not save the attempt log first, so nothing was fetched."; exit 1 ;;
            *) echo "::error::Unexpected exit code ${{ steps.refresh.outputs.code }}"; exit 1 ;;
          esac

  # ---------------------------------------------------------------- website ---
  site:
    needs: [check, install, refresh]
    if: >-
      always() && needs.install.result != 'failure' &&
      (needs.check.outputs.installed == 'true' || needs.install.result == 'success') &&
      (contains(fromJSON('["push","website","install"]'), needs.check.outputs.task) || needs.refresh.outputs.saved == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load the data branch
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git clone -q --depth 1 --branch data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
            rm -rf data/.git
          else
            echo "No data yet; the site will say so until the first pull."
            mkdir -p data
          fi
      - name: Build the website
        env:
          RR_DATA_DIR: ${{ github.workspace }}/data
          SITE_DEMO: ${{ vars.SITE_DEMO }}
        run: |
          if [ "$SITE_DEMO" = "true" ]; then python -m rr site --out _site --demo; else python -m rr site --out _site; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: site
    if: always() && needs.site.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: echo "::notice::Your dashboard is live at ${{ steps.deployment.outputs.page_url }}"
